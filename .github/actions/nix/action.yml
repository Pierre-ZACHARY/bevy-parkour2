name: Nix Linux environment
description: Install Nix and restore the project's Crane/store cache
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - uses: nix-community/cache-nix-action@b16f249a0248efec86dd9d4224cb75f1ffa48bcc
      with:
        primary-key: nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml', 'tools/xtask/tools.lock.json') }}-${{ github.sha }}
        restore-prefixes-first-match: |
          nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml', 'tools/xtask/tools.lock.json') }}-
          nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
        save: ${{ github.event_name != 'pull_request' }}
        gc-max-store-size-linux: 8G
    - name: Prepare and retain the shared CI environment
      shell: bash
      run: |
        mkdir -p .compiler-cache
        nix develop .#ci --profile .compiler-cache/nix-ci-profile -c bash -c '
          dirname "$(command -v rustc)" >> "$GITHUB_PATH"
          echo "PARKOUR_NIX_RUSTC=$PARKOUR_NIX_RUSTC" >> "$GITHUB_ENV"
          echo "PARKOUR_NIX_SCCACHE=$PARKOUR_NIX_SCCACHE" >> "$GITHUB_ENV"
        '
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        key: nix-${{ github.job }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix', 'tools/xtask/tools.lock.json') }}
        cache-directories: target/xtask-cache
