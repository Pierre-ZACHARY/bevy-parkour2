[package]
name = "game_telemetry"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
official = ["dep:sentry", "dep:tracing", "dep:tracing-subscriber", "dep:wasm-bindgen"]

[dependencies]
serde_json = "1"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sentry = { version = "=0.49.5", optional = true, default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "tracing", "ureq", "rustls", "minidump"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }

[[example]]
name = "browser_probe"
crate-type = ["cdylib"]
required-features = ["official"]
