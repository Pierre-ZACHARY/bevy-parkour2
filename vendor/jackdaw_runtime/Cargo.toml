[package]
edition = "2024"
rust-version = "1.97.1"
name = "jackdaw_runtime"
version = "0.20.1-rc.1"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Runtime scene loader for the Jackdaw editor"
readme = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[features]
basisu = ["render", "dep:bevy_basisu_loader"]
animation = [
    "dep:jackdaw_animation_runtime",
    "bevy/bevy_animation",
    "bevy/bevy_gltf",
    "bevy/gltf_animation",
]
default = [
    "render",
    "soft_shadows",
    "texture-import",
]
navmesh = ["dep:jackdaw_terrain"]
pie = [
    "dep:jackdaw_pie_protocol",
    "jackdaw_pie_protocol/ipc",
    "dep:jackdaw_camera_rig",
    "bevy/bevy_render",
    "bevy/bevy_image",
    "bevy/mesh_picking",
]
render = [
    "dep:jackdaw_surface",
    "bevy/bevy_pbr",
    "bevy/bevy_gltf",
    "bevy/bevy_render",
    "bevy/bevy_image",
    "jackdaw_geometry/render",
    "jackdaw_scene_types/render",
    "jackdaw_widgets_runtime/feathers",
]
texture-import = ["render", "bevy/basis-universal", "bevy/compressed_image_saver_universal"]
soft_shadows = [
    "render",
    "bevy/experimental_pbr_pcss",
]
terrain = [
    "render",
    "navmesh",
    "jackdaw_terrain/render",
]

