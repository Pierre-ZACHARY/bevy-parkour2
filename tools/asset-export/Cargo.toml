[package]
name = "asset-export"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
jackdaw_bsn = "=0.20.1-rc.1"
# jackdaw_bsn applies Visibility but does not declare its required Bevy feature.
bevy = { version = "=0.20.1", default-features = false, features = ["bevy_camera"] }
walkdir = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
