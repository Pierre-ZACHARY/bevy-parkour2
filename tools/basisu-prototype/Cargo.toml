[package]
name = "basisu-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_winit", "bevy_pbr", "bevy_gltf", "bevy_log", "bevy_state", "png", "webgpu", "x11", "wayland", "tonemapping_luts", "zstd_rust"] }
bevy_basisu_loader = { workspace = true }
jackdaw_runtime = { version = "=0.20.1-rc.1", optional = true, default-features = false, features = ["render"] }
serde_json = "1"
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Location"] }

[features]
jackdaw = ["dep:jackdaw_runtime", "jackdaw_runtime/basisu", "bevy/custom_cursor"]
